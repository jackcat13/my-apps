# Shared nextest config: scripts/check.sh passes it with --config-file.
nextest-version = { required = "0.9.152" }

[store]
dir = "target/nextest"

[profile.default]
slow-timeout = { period = "30s", terminate-after = 4 }

[profile.ci]
fail-fast = false
slow-timeout = { period = "60s", terminate-after = 5 }
