[package]
name = "life-dashboard"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
description = "Personal finance/stats dashboard"
publish = false

[dependencies]
anyhow = "1"
eframe = { version = "0.37.0", default-features = false, features = [
    "clipboard",
    "default_fonts",
    "links",
    "system_fonts",
    "wayland",
    "wgpu",
    "x11",
] }
etcetera = "0.11.0"
jiff = "1.0.1"
poll-promise = { version = "0.3.0", features = ["tokio"] }
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls-native-roots",
] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.1", default-features = false, features = [
    "sqlite",
    "runtime-tokio",
    "migrate",
    "derive",
    "macros",
] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3.27.0"
wiremock = "0.6.5"

# Recommended default. Profiles are per app: tune them to this app's needs.
[profile.release]
lto = "thin"
codegen-units = 1

# BEGIN shared lints: generated from /lints.toml by `just sync-lints`. Do not edit.
[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
# Shipped code never panics: return Result/Option instead.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
exit = "deny"
mem_forget = "deny"
# Diagnostics go through tracing; a CLI's real output goes through one module with an #[expect].
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
# Structure.
cognitive_complexity = "deny"
too_many_arguments = "deny"
wildcard_imports = "deny"
# Every unsafe block says why it is sound.
undocumented_unsafe_blocks = "deny"
# Suppressions are #[expect] with a reason, so stale ones fail the build.
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
# END shared lints
